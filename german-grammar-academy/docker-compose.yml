services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: german_academy
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d german_academy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://academy:academy_dev_password@db:5432/german_academy?sslmode=disable
      PORT: "8080"
      FRONTEND_ORIGIN: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - api

volumes:
  postgres_data:
